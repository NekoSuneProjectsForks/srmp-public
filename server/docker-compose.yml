# Optional. Everything here can also be done with plain `docker run` —
# see the README, or run:  docker run --rm IMAGE help
services:
  srmp:
    # Prebuilt runtime image from CI. Contains Wine/Xvfb/SteamCMD only — the
    # game, SRML and the mod are installed on first start, on your machine.
    # Adjust the path if your fork lives elsewhere.
    image: ghcr.io/nekosunevr/srmp-public-server:latest
    # To build it yourself instead, comment out `image:` above and use:
    # build: .
    container_name: srmp-server
    volumes:
      # Game install. Left empty, steamcmd fills it on first boot.
      - ./game:/game
      # Put your built SRMP.dll here (and optionally SRMLInstaller.exe).
      - ./mods:/mods
      # Steam login cache — keeps you from re-entering Steam Guard every boot.
      - ./steam:/steam
      - wineprefix:/wine
    environment:
      # --- Steam -------------------------------------------------------------
      # Run the one-time login first:
      #   docker compose run --rm -it srmp login
      STEAM_USER: ""
      STEAM_APPID: "433340"
      # auto = download only if the game is missing. always = update every boot.
      STEAM_UPDATE: "auto"

      # --- Rendering ---------------------------------------------------------
      # No GPU on a VPS. "nographics" skips rendering entirely — cheapest, and
      # it sidesteps graphics init altogether. "software" runs the real D3D11
      # path through Wine's wined3d on llvmpipe; use it only if nographics
      # misbehaves. Do not add -force-glcore: this build has D3D11 shaders only
      # and forcing OpenGL Core fails with "InitializeEngineGraphics failed".
      RENDER_MODE: "nographics"

      # --- Server ------------------------------------------------------------
      SRMP_USERNAME: "Server"
      # Existing save to host. Leave empty to create a fresh world on first boot.
      SRMP_GAME: ""
      SRMP_NEW_GAME_NAME: "SRMP Server"
      # CLASSIC, CASUAL, TIME_LIMIT or TIME_LIMIT_V2
      SRMP_GAMEMODE: "CLASSIC"
      # Lobby capacity including the host. EOS allows up to 64, but every extra
      # player is more packet traffic and more actor ownership for one machine
      # to arbitrate. See "Sizing the server" in the README.
      SRMP_SLOTS: "16"
      SRMP_STATUS_INTERVAL: "60"
      SRMP_AUTOSAVE_INTERVAL: "300"
      # How long to let the game save and quit before it is forced down.
      # Keep stop_grace_period comfortably above this.
      SHUTDOWN_GRACE_SECONDS: "45"
    restart: unless-stopped

    # --- Resources -----------------------------------------------------------
    # Docker imposes NO memory limit unless you set one, so by default the
    # container could already use all host RAM. Setting a limit protects the
    # host but does not make the server faster — and a limit that is too low
    # gets the container OOM-killed mid-game.
    mem_limit: "4g"
    # Reserve headroom so the kernel is less eager to reclaim from us.
    mem_reservation: "2g"
    # The host arbitrates every player. Starving it of CPU is the likeliest
    # cause of players seeing each other desync, so do not set this below 2.
    cpus: "2.0"

    # Wine plus a Unity scene needs headroom; software rendering is CPU-bound.
    shm_size: "1gb"
    # Must exceed SHUTDOWN_GRACE_SECONDS so the world finishes saving.
    stop_grace_period: 60s

volumes:
  wineprefix:
